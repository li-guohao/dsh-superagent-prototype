# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md
# and docs/quickstart-maildrop.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082

# Required. Absolute, stable directory: holds orchestrator.sqlite, the lock file and the
# master Session identity. A different path is effectively a different orchestrator.
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>

# File-system mailbox Source: polls `inbox` every `pollSeconds`, replies land in `outbox`.
# Both paths must already exist; only *.json files are picked up, in filename order.
- id: dsh-superagent-maildrop
  disabled: false
  config:
    inbox: <absolute path, for example /home/me/.dsh/maildrop/inbox>
    outbox: <absolute path, for example /home/me/.dsh/maildrop/outbox>
    pollSeconds: 2

# Local fake LLM used by examples/fake_model_endpoint.py.
# `apiKeyEnv` names an environment variable read from the *process* environment at request
# time — never from this file. Export it when starting dsh (see docs/quickstart-maildrop.md).
# The value below is a placeholder; do not put a real key in this file.
- id: llm-pi-ai
  config:
    providers:
      fake-local:
        api: openai-completions
        baseURL: http://127.0.0.1:18787/v1
        apiKeyEnv: FAKE_LLM_KEY
        models:
          - id: any-model
- id: agent-default-model
  config:
    provider: fake-local
    model: any-model

# Real DeepSeek route (optional alternative to the fake local endpoint above).
# There is no `api:` field for this adapter: the base bundle already mounts
# `@deepseek-ai/dsh-llm-deepseek`, whose provider route is `deepseek-official`
# (Messages wire format, default baseURL https://api.deepseek.com/anthropic).
# This row only names the credential reference; the key itself never lives in
# this file. Export `DEEPSEEK_API_KEY` in the process that starts dsh, or store
# it through the credentials service (the web Models page writes it) — see
# docs/quickstart-maildrop.md §10.
# Uncomment this row plus the `agent-default-model` row below to switch over.
# - id: llm-deepseek
#   config:
#     apiKeyEnv: DEEPSEEK_API_KEY
# - id: agent-default-model
#   config:
#     provider: deepseek-official
#     model: deepseek-flash

# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
